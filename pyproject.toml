[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-memory"
version = "0.1.0"
description = "Local-first ambient memory for your Mac. Capture your work, store it locally, query it from Claude Code / Codex over MCP. No cloud, no subscription."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Memento contributors" }]
keywords = ["memory", "mcp", "claude", "ambient", "macos", "local-first"]
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
# Everything else (capture, storage, search, embeddings, agent) is stdlib-only.
dev = ["pytest>=7"]

[project.scripts]
memento = "memento.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/memento"

[tool.setuptools]
packages = ["memento"]
