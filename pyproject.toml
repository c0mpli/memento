[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-memory"
version = "0.1.0"
description = "Local-first ambient memory for your Mac. Capture your work, store it locally, query it from Claude Code / Codex over MCP. No cloud, no subscription."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Memento contributors" }]
keywords = ["memory", "mcp", "claude", "ambient", "macos", "local-first"]
dependencies = [
    "mcp>=1.0",
    "rumps>=0.4.0; sys_platform == 'darwin'",   # menu-bar app (default UI)
]

[project.optional-dependencies]
# Deep per-app content capture via the macOS Accessibility API (pyobjc).
ax = [
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]
dev = ["pytest>=7"]

[project.scripts]
memento = "memento.cli:main"

[project.urls]
Homepage = "https://github.com/c0mpli/memento"

[tool.setuptools.packages.find]
include = ["memento*"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=7"]
